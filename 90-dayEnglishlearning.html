<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>90天英语学习课程 - 完整版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#eef6ff 0%,#f9f4ff 50%,#fff9f2 100%);color:#1f2d3d;line-height:1.7}
.page{max-width:1200px;margin:0 auto;padding:18px}
.hero{background:linear-gradient(135deg,#0f6cbd 0%,#3aa7ff 100%);color:#fff;border-radius:22px;padding:24px 28px;margin-bottom:16px;box-shadow:0 12px 30px rgba(15,108,189,.25)}
.hero h1{font-size:26px;margin-bottom:6px}
.hero p{opacity:.92;font-size:14px}
.progress-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}
.progress-fill{height:100%;width:1.1%;background:#fff;border-radius:999px;transition:width .3s}
.layout{display:grid;grid-template-columns:260px 1fr;gap:16px}
.sidebar{background:rgba(255,255,255,.96);border:1px solid #e6eef7;border-radius:18px;padding:14px;position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow-y:auto}
.sidebar h3{font-size:15px;color:#0f6cbd;margin-bottom:8px}
.phase-group{margin-bottom:12px}
.phase-title{font-size:13px;font-weight:bold;color:#667085;padding:6px 8px;background:#f4f9ff;border-radius:8px;margin-bottom:6px}
.day-list{display:grid;gap:4px}
.day-btn{width:100%;text-align:left;border:1px solid #e6eef7;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px;transition:all .15s;color:#3a4a5c}
.day-btn:hover{border-color:#0f6cbd;background:#f4f9ff}
.day-btn.active{background:#0f6cbd;color:#fff;border-color:#0f6cbd}
.day-btn.done{border-color:#43a047;color:#2e7d32}
.main{min-width:0}
.section{background:rgba(255,255,255,.96);border:1px solid #e6eef7;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 6px 18px rgba(31,45,61,.05)}
.section h2{font-size:20px;color:#0f6cbd;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #eef4fb;display:flex;align-items:center;gap:8px}
.section h3{font-size:16px;margin:14px 0 8px;color:#1f2d3d}
.section p{color:#3a4a5c;margin-bottom:8px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:bold;margin-right:6px}
.tag-goal{background:#e8f5e9;color:#2e7d32}
.tag-ipa{background:#fff3e0;color:#e65100}
.tag-gram{background:#e3f2fd;color:#1565c0}
.tag-read{background:#f3e5f5;color:#7b1fa2}
.tag-talk{background:#fce4ec;color:#c2185b}
.tag-ex{background:#e0f7fa;color:#00838f}
.tag-review{background:#f1f8e9;color:#558b2f}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
th,td{border:1px solid #e6eef7;padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f4f9ff;color:#0f6cbd;font-weight:bold}
.ipa{color:#e65100;font-family:"Doulos SIL","Charis SIL",serif}
.play-btn{display:inline-flex;align-items:center;gap:3px;background:#eef5ff;color:#0f6cbd;border:none;border-radius:7px;padding:3px 9px;cursor:pointer;font-size:12px;margin-left:4px;transition:all .15s}
.play-btn:hover{background:#0f6cbd;color:#fff}
.example-box{background:#f9fbff;border-left:4px solid #0f6cbd;padding:10px 14px;border-radius:0 10px 10px 0;margin:8px 0}
.example-box .en{font-size:15px;font-weight:bold;color:#1f2d3d}
.example-box .ipa{color:#e65100;font-size:13px;margin:2px 0}
.example-box .cn{color:#526071;font-size:13px}
.tip-box{background:#fffaf1;border-left:4px solid #ffa726;padding:10px 14px;border-radius:0 10px 10px 0;margin:8px 0}
.tip-box strong{color:#e65100}
.error-box{background:#fff5f5;border-left:4px solid #ef5350;padding:10px 14px;border-radius:0 10px 10px 0;margin:8px 0}
.error-box strong{color:#c62828}
.reading-line{background:#f9fbff;border-radius:10px;padding:10px 14px;margin:6px 0}
.reading-line .en{font-size:15px;color:#1f2d3d}
.reading-line .ipa{color:#e65100;font-size:13px;margin:2px 0}
.reading-line .cn{color:#526071;font-size:13px}
.dialogue{display:grid;gap:8px}
.dlg-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:start}
.dlg-who{font-weight:bold;color:#0f6cbd;padding-top:3px;font-size:13px}
.dlg-content .en{font-weight:bold;font-size:14px}
.dlg-content .ipa{color:#e65100;font-size:12px}
.dlg-content .cn{color:#526071;font-size:12px}
.quiz-item{background:#f9fbff;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #e6eef7}
.quiz-q{font-weight:bold;margin-bottom:8px;color:#1f2d3d;font-size:14px}
.quiz-q .qnum{color:#0f6cbd;margin-right:5px}
.quiz-options{display:grid;gap:6px}
.quiz-opt{padding:8px 12px;border:1px solid #d9e7f5;border-radius:8px;cursor:pointer;background:#fff;transition:all .15s;font-size:13px}
.quiz-opt:hover{border-color:#0f6cbd;background:#f4f9ff}
.quiz-opt.correct{border-color:#43a047;background:#e8f5e9;color:#2e7d32}
.quiz-opt.wrong{border-color:#e53935;background:#ffebee;color:#c62828}
.quiz-opt.disabled{pointer-events:none}
.quiz-input{width:100%;padding:8px 12px;border:1px solid #d9e7f5;border-radius:8px;font-size:13px;font-family:inherit}
.quiz-input:focus{outline:none;border-color:#0f6cbd}
textarea.quiz-input{resize:vertical;min-height:60px}
.quiz-feedback{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:13px;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.ok{background:#e8f5e9;color:#2e7d32}
.quiz-feedback.no{background:#ffebee;color:#c62828}
.btn-check{background:#0f6cbd;color:#fff;border:none;border-radius:10px;padding:9px 20px;cursor:pointer;font-size:14px;font-weight:bold;margin-top:10px}
.btn-check:hover{background:#0d5ba3}
.btn-toggle{background:#eef5ff;color:#0f6cbd;border:none;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px;font-weight:bold;margin-top:6px}
.goal-list{list-style:none;padding:0}
.goal-list li{padding:5px 0 5px 24px;position:relative;color:#3a4a5c;font-size:14px}
.goal-list li::before{content:"✓";position:absolute;left:0;color:#43a047;font-weight:bold}
.ipa-card{display:inline-block;background:#fff3e0;border:1px solid #ffe0b2;border-radius:10px;padding:10px 14px;margin:4px;text-align:center;min-width:90px}
.ipa-card .sym{font-size:24px;color:#e65100;font-family:"Doulos SIL",serif}
.ipa-card .word{font-size:12px;color:#1f2d3d;margin-top:2px}
.ipa-card .cn{font-size:11px;color:#526071}
.word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}
.word-card{background:#f9fbff;border:1px solid #e6eef7;border-radius:12px;padding:12px}
.word-card .w-en{font-size:16px;font-weight:bold;color:#1f2d3d}
.word-card .w-ipa{color:#e65100;font-size:13px;margin:1px 0}
.word-card .w-pos{color:#0f6cbd;font-size:11px}
.word-card .w-cn{color:#526071;font-size:13px;margin:3px 0}
.word-card .w-ex{color:#3a4a5c;font-size:12px;font-style:italic}
.score-card{background:linear-gradient(135deg,#e3f2fd,#f3e5f5);border-radius:14px;padding:18px;text-align:center;margin:12px 0}
.score-card .score{font-size:38px;font-weight:bold;color:#0f6cbd}
.score-card .label{color:#526071;margin-top:4px;font-size:13px}
.hidden{display:none!important}
.footer-note{text-align:center;color:#98a2b3;font-size:12px;margin-top:16px;padding:12px}
.day-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.day-header h2{font-size:24px;border:none;padding:0;margin:0}
.day-nav{display:flex;gap:8px}
.nav-btn{background:#eef5ff;color:#0f6cbd;border:none;border-radius:10px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:bold}
.nav-btn:hover{background:#0f6cbd;color:#fff}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:768px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}}
</style>
</head>

<script>
/* ============ 语音播放 ============ */
function speak(text){
    if('speechSynthesis' in window){
        speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(text);
        u.lang='en-GB';u.rate=0.85;
        const vs=speechSynthesis.getVoices();
        const gb=vs.find(v=>v.lang.startsWith('en-GB'));
        if(gb)u.voice=gb;
        speechSynthesis.speak(u);
    }else{alert('当前浏览器不支持语音播放，请使用最新版 Chrome/Edge。');}
}
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}

/* ============ 渲染引擎 ============ */
const PHASE_NAMES={1:'第一阶段：基础重建 (Day 1-14)',2:'第二阶段：词汇与基础语法 (Day 15-30)',3:'第三阶段：阅读与表达 (Day 31-60)',4:'第四阶段：综合提升 (Day 61-90)'};
const PHASE_BOUNDS={1:[1,14],2:[15,30],3:[31,60],4:[61,90]};
let currentDay=1;

/* 语音按钮：把文本中的双引号转义，避免 onclick 属性引号冲突 */
function pb(text){return '<button class="play-btn" onclick="speak(this.dataset.t)" data-t="'+text.replace(/"/g,'&quot;')+'">🔊 朗读</button>';}
function esc(s){return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* 构建侧边栏导航 */
function buildNav(){
  const nav=document.getElementById('day-nav');
  let html='';
  for(let p=1;p<=4;p++){
    const [s,e]=PHASE_BOUNDS[p];
    const days=C.filter(d=>d.phase===p);
    if(days.length===0)continue;
    html+='<div class="phase-group"><div class="phase-title">'+PHASE_NAMES[p]+'</div><div class="day-list">';
    days.forEach(d=>{
      html+='<button class="day-btn" data-day="'+d.day+'">Day '+d.day+' · '+esc(d.title)+'</button>';
    });
    html+='</div></div>';
  }
  nav.innerHTML=html;
  nav.querySelectorAll('.day-btn').forEach(btn=>{
    btn.addEventListener('click',()=>showDay(+btn.dataset.day));
  });
}

/* 渲染某一天 */
function showDay(n){
  if(n<1||n>C.length)return;
  currentDay=n;
  const d=C[n-1];
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',+b.dataset.day===n));
  document.getElementById('progress-fill').style.width=(n/90*100)+'%';
  const main=document.getElementById('main-content');
  let h='';
  /* 头部 */
  h+='<div class="day-header"><h2>Day '+d.day+'：'+esc(d.title)+'</h2>';
  h+='<div class="day-nav"><button class="nav-btn" onclick="showDay('+(n-1)+')" '+(n===1?'disabled':'')+'>◀ 上一天</button>';
  h+='<button class="nav-btn" onclick="showDay('+(n+1)+')" '+(n===C.length?'disabled':'')+'>下一天 ▶</button></div></div>';
  /* 目标 */
  h+='<div class="section"><h2>🎯 今日目标</h2><p>'+esc(d.goal)+'</p></div>';
  /* 音标 */
  if(d.ipa&&d.ipa.length){
    h+='<div class="section"><h2>🔤 音标学习 <span class="tag tag-ipa">IPA</span></h2>';
    h+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0">';
    d.ipa.forEach(it=>{
      h+='<div class="ipa-card"><div class="sym">'+it.sym+'</div><div class="word">'+esc(it.word)+'</div><div class="cn">'+esc(it.cn)+'</div>';
      if(it.desc)h+='<div style="font-size:11px;color:#666;margin-top:4px;line-height:1.4">'+esc(it.desc)+'</div>';
      h+='</div>';
    });
    h+='</div>';
    const mistakes=d.ipa.filter(i=>i.mistake).map(i=>i.mistake);
    if(mistakes.length)h+='<div class="error-box"><strong>⚠️ 易错点：</strong>'+esc(mistakes.join('；'))+'</div>';
    h+='</div>';
  }
  /* 单词 */
  if(d.words&&d.words.length){
    h+='<div class="section"><h2>📖 今日单词 <span class="tag tag-goal">10个</span></h2>';
    h+='<div class="word-grid">';
    d.words.forEach(w=>{
      h+='<div class="word-card">';
      h+='<div class="w-en">'+esc(w.en)+' '+pb(w.en)+'</div>';
      h+='<div class="w-ipa">'+w.ipa+'</div>';
      h+='<div class="w-pos">'+esc(w.pos)+' · '+esc(w.cn)+'</div>';
      if(w.ex){h+='<div class="w-ex">'+esc(w.ex)+pb(w.ex)+'</div>';}
      if(w.exc)h+='<div style="color:#526071;font-size:12px">'+esc(w.exc)+'</div>';
      h+='</div>';
    });
    h+='</div></div>';
  }
  /* 语法 */
  if(d.grammar){
    const g=d.grammar;
    h+='<div class="section"><h2>📝 语法要点 <span class="tag tag-gram">Grammar</span></h2>';
    h+='<div class="example-box"><strong>规则：</strong>'+esc(g.rule)+'</div>';
    if(g.structure)h+='<p><strong>结构：</strong>'+esc(g.structure)+'</p>';
    h+='<table><thead><tr><th>肯定句</th><th>否定句</th><th>疑问句</th></tr></thead><tbody>';
    h+='<tr><td>'+esc(g.pos||'—')+pb(g.pos||'')+'</td><td>'+esc(g.neg||'—')+pb(g.neg||'')+'</td><td>'+esc(g.ques||'—')+pb(g.ques||'')+'</td></tr>';
    h+='</tbody></table>';
    if(g.mistake)h+='<div class="error-box"><strong>⚠️ 常见错误：</strong>'+esc(g.mistake)+'</div>';
    h+='</div>';
  }
  /* 阅读 */
  if(d.reading){
    const r=d.reading;
    h+='<div class="section"><h2>📚 分级阅读 <span class="tag tag-read">Reading</span></h2>';
    h+='<h3>'+esc(r.title)+' '+pb(r.title)+'</h3>';
    r.lines.forEach(l=>{
      h+='<div class="reading-line">';
      h+='<div class="en">'+esc(l.en)+' '+pb(l.en)+'</div>';
      h+='<div class="ipa">'+l.ipa+'</div>';
      h+='<div class="cn">'+esc(l.cn)+'</div>';
      h+='</div>';
    });
    if(r.vocab&&r.vocab.length){
      h+='<h3>📌 重点词汇</h3><p style="font-size:13px">';
      r.vocab.forEach((v,i)=>{h+=(i>0?' · ':'')+esc(v);});
      h+='</p>';
    }
    if(r.grammar)h+='<div class="tip-box"><strong>语法点：</strong>'+esc(r.grammar)+'</div>';
    if(r.questions&&r.questions.length){
      h+='<h3>❓ 阅读理解</h3>';
      r.questions.forEach((q,i)=>{h+=renderChoice('r'+i,q);});
    }
    h+='</div>';
  }
  /* 对话 */
  if(d.dialogue){
    const dl=d.dialogue;
    h+='<div class="section"><h2>💬 日常对话 <span class="tag tag-talk">Dialogue</span></h2>';
    h+='<p style="color:#667085;font-size:13px">🎭 场景：'+esc(dl.scenario)+'</p>';
    h+='<div class="dialogue">';
    dl.lines.forEach(l=>{
      h+='<div class="dlg-row"><div class="dlg-who">'+esc(l.who)+'</div><div class="dlg-content">';
      h+='<div class="en">'+esc(l.en)+' '+pb(l.en)+'</div>';
      h+='<div class="ipa">'+l.ipa+'</div>';
      h+='<div class="cn">'+esc(l.cn)+'</div>';
      h+='</div></div>';
    });
    h+='</div></div>';
  }
  /* 口语 */
  if(d.speaking&&d.speaking.length){
    h+='<div class="section"><h2>🗣️ 口语练习 <span class="tag tag-ex">Speaking</span></h2><ul class="goal-list">';
    d.speaking.forEach(s=>h+='<li>'+esc(s)+'</li>');
    h+='</ul></div>';
  }
  /* 测验 */
  if(d.quiz){
    const qz=d.quiz;
    h+='<div class="section"><h2>✅ 今日测验</h2>';
    if(qz.word&&qz.word.length){h+='<h3>📖 词汇题</h3>';qz.word.forEach((q,i)=>h+=renderChoice('w'+i,q));}
    if(qz.grammar&&qz.grammar.length){h+='<h3>📝 语法题</h3>';qz.grammar.forEach((q,i)=>h+=renderChoice('g'+i,q));}
    if(qz.reading&&qz.reading.length){h+='<h3>📚 阅读题</h3>';qz.reading.forEach((q,i)=>h+=renderChoice('q'+i,q));}
    if(qz.trans&&qz.trans.length){
      h+='<h3>✍️ 翻译题</h3>';
      qz.trans.forEach((q,i)=>{
        const id='t'+i;
        h+='<div class="quiz-item"><div class="quiz-q"><span class="qnum">T'+(i+1)+'.</span>'+esc(q.q)+'</div>';
        h+='<input class="quiz-input" id="'+id+'" placeholder="输入英文翻译...">';
        h+='<div style="margin-top:6px"><button class="btn-check" onclick="checkTrans(\''+id+'\','+i+')">检查答案</button></div>';
        h+='<div class="quiz-feedback" id="fb_'+id+'"></div></div>';
      });
    }
    if(qz.speak){
      h+='<h3>🗣️ 口语表达</h3>';
      h+='<div class="quiz-item"><div class="quiz-q">'+esc(qz.speak)+'</div>';
      h+='<textarea class="quiz-input" placeholder="在这里写下你的回答，然后朗读出来..."></textarea>';
      h+='<div class="tip-box" style="margin-top:8px"><strong>提示：</strong>写完后大声朗读，注意语音语调。可以用上方朗读按钮听范例发音。</div>';
      h+='</div>';
    }
    h+='</div>';
  }
  /* 复习 */
  if(d.review){
    const rv=d.review;
    h+='<div class="section"><h2>🔁 今日复习 <span class="tag tag-review">Review</span></h2>';
    if(rv.summary&&rv.summary.length){h+='<h3>📌 要点总结</h3><ul class="goal-list">';rv.summary.forEach(s=>h+='<li>'+esc(s)+'</li>');h+='</ul>';}
    if(rv.words&&rv.words.length)h+='<p><strong>核心单词：</strong>'+rv.words.map(w=>'<span class="tag tag-goal" style="margin:2px">'+esc(w)+'</span>').join('')+'</p>';
    if(rv.patterns&&rv.patterns.length){h+='<h3>🔤 核心句型</h3><div class="example-box">';rv.patterns.forEach(p=>h+='<p style="margin:2px 0">'+esc(p)+' '+pb(p)+'</p>');h+='</div>';}
    if(rv.task)h+='<div class="tip-box"><strong>📋 今日任务：</strong>'+esc(rv.task)+'</div>';
    if(rv.next)h+='<div class="example-box"><strong>📅 明日预告：</strong>'+esc(rv.next)+'</div>';
    h+='</div>';
  }
  main.innerHTML=h;
  main.scrollIntoView({behavior:'smooth',block:'start'});
}

/* 渲染选择题 */
function renderChoice(id,q){
  let h='<div class="quiz-item"><div class="quiz-q"><span class="qnum">Q.</span>'+esc(q.q)+'</div>';
  h+='<div class="quiz-options" id="opts_'+id+'">';
  q.opts.forEach((o,i)=>{
    h+='<div class="quiz-opt" data-idx="'+i+'" onclick="answerChoice(\''+id+'\','+i+','+q.ans+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</div>';
  });
  h+='</div><div class="quiz-feedback" id="fb_'+id+'"></div></div>';
  return h;
}

/* 选择题作答 */
function answerChoice(id,chosen,correct){
  const box=document.getElementById('opts_'+id);
  const fb=document.getElementById('fb_'+id);
  if(box.dataset.answered)return;
  box.dataset.answered='1';
  box.querySelectorAll('.quiz-opt').forEach((el,i)=>{
    el.classList.add('disabled');
    if(i===correct)el.classList.add('correct');
    if(i===chosen&&i!==correct)el.classList.add('wrong');
  });
  fb.className='quiz-feedback show '+(chosen===correct?'ok':'no');
  fb.textContent=(chosen===correct?'✅ 回答正确！':'❌ 回答错误。正确答案是：'+String.fromCharCode(65+correct));
}

/* 翻译题检查 */
function checkTrans(id,idx){
  const input=document.getElementById(id);
  const fb=document.getElementById('fb_'+id);
  const ans=C[currentDay-1].quiz.trans[idx].ans.toLowerCase().trim();
  const val=input.value.toLowerCase().trim().replace(/\s+/g,' ');
  if(!val){fb.className='quiz-feedback show no';fb.textContent='请先输入答案。';return;}
  /* 宽松匹配：去除标点后比较 */
  const norm=s=>s.replace(/[.,!?;:"'()]/g,'').replace(/\s+/g,' ').trim();
  const ok=norm(val)===norm(ans);
  fb.className='quiz-feedback show '+(ok?'ok':'no');
  fb.innerHTML=(ok?'✅ 回答正确！':'❌ 参考答案：'+esc(C[currentDay-1].quiz.trans[idx].ans));
}

/* 初始化 */
buildNav();
showDay(1);
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎈 小学趣味学习乐园 - 语文·数学·英语·游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    color: #333;
}
.app-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}
/* 顶部栏 */
.header {
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 20px 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}
.header h1 {
    font-size: 28px;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.header .subtitle { font-size: 14px; color: #888; margin-top: 5px; }
.user-info {
    display: flex;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}
.grade-select {
    padding: 10px 15px;
    border-radius: 12px;
    border: 2px solid #667eea;
    font-size: 14px;
    background: white;
    cursor: pointer;
    outline: none;
}
.progress-bar-container {
    min-width: 180px;
}
.progress-label {
    font-size: 13px;
    color: #666;
    margin-bottom: 5px;
    display: flex;
    justify-content: space-between;
}
.progress-bar {
    height: 14px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00b894, #00cec9);
    border-radius: 10px;
    transition: width 0.5s ease;
}
.stars-display {
    font-size: 22px;
    background: linear-gradient(90deg, #feca57, #ff9f43);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: bold;
}
.action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
    padding: 10px 18px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
.btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
.btn-success { background: linear-gradient(135deg, #00b894, #00cec9); color: white; }
.btn-warning { background: linear-gradient(135deg, #feca57, #ff9f43); color: white; }
.btn-danger { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: white; }
.btn-info { background: linear-gradient(135deg, #48dbfb, #0abde3); color: white; }

/* 导航标签 */
.tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.tab {
    flex: 1;
    min-width: 130px;
    padding: 18px 15px;
    background: rgba(255,255,255,0.95);
    border-radius: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    font-size: 16px;
    font-weight: bold;
    border: 3px solid transparent;
}
.tab:hover { transform: translateY(-4px); }
.tab.active {
    transform: translateY(-4px);
    border-color: currentColor;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.tab-chinese { color: #e74c3c; }
.tab-math { color: #3498db; }
.tab-english { color: #27ae60; }
.tab-game { color: #9b59b6; }
.tab-icon { font-size: 32px; display: block; margin-bottom: 6px; }

/* 主内容区 */
.panel {
    background: rgba(255,255,255,0.97);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    min-height: 500px;
}
.panel.hidden { display: none; }

/* 主题色标题 */
.section-title {
    font-size: 24px;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 3px dashed #eee;
    display: flex;
    align-items: center;
    gap: 10px;
}

/* 知识卡片网格 */
.topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
    margin-bottom: 30px;
}
.topic-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s;
    border: 2px solid #eee;
    position: relative;
    overflow: hidden;
}
.topic-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}

.topic-card.completed {
    border-color: #00b894;
    background: linear-gradient(135deg, #e8f8f5, #d1f2eb);
}
.topic-status {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 20px;
}
.topic-icon {
    font-size: 40px;
    margin-bottom: 10px;
}
.topic-name {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 8px;
}
.topic-desc {
    font-size: 13px;
    color: #888;
    line-height: 1.5;
}
.topic-progress-text {
    margin-top: 10px;
    font-size: 12px;
    color: #666;
}

/* 学习模态框 */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
    background: white;
    border-radius: 20px;
    width: 100%;
    max-width: 700px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal-header {
    padding: 25px 30px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-radius: 20px 20px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}
.modal-header.chinese { background: linear-gradient(135deg, #e74c3c, #c0392b); }
.modal-header.math { background: linear-gradient(135deg, #3498db, #2980b9); }
.modal-header.english { background: linear-gradient(135deg, #27ae60, #1e8449); }
.modal-header.game { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
.modal-title { font-size: 22px; }
.modal-close {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
}
.modal-body { padding: 30px; }
.question-area {
    background: #f8f9fa;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
}
.question-text {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
    line-height: 1.6;
}
.question-meta {
    font-size: 13px;
    color: #888;
    margin-bottom: 15px;
    display: flex;
    gap: 15px;
}
.options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
}
.option-btn {
    padding: 15px 20px;
    background: white;
    border: 2px solid #ddd;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
    text-align: left;
}
.option-btn:hover:not(:disabled) {
    border-color: #667eea;
    background: #f5f3ff;
    transform: translateX(4px);
}
.option-btn.correct {
    background: #d4edda;
    border-color: #28a745;
    color: #155724;
}
.option-btn.wrong {
    background: #f8d7da;
    border-color: #dc3545;
    color: #721c24;
}
.option-btn:disabled { cursor: default; }
.explanation {
    margin-top: 15px;
    padding: 15px;
    background: #fff3cd;
    border-radius: 10px;
    border-left: 4px solid #ffc107;
    font-size: 14px;
    line-height: 1.6;
    display: none;
}
.explanation.show { display: block; }
.modal-footer {
    padding: 20px 30px;
    border-top: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}
.question-nav { display: flex; gap: 8px; align-items: center; }
.score-display {
    padding: 8px 16px;
    background: linear-gradient(135deg, #feca57, #ff9f43);
    color: white;
    border-radius: 20px;
    font-weight: bold;
}

/* 奖励弹窗 */
.reward-modal {
    text-align: center;
    padding: 40px;
}
.reward-emoji {
    font-size: 80px;
    animation: bounce 1s infinite;
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}
.reward-title {
    font-size: 32px;
    margin: 20px 0;
    color: #e74c3c;
}
.reward-stars {
    font-size: 50px;
    margin: 20px 0;
}
.reward-message {
    font-size: 16px;
    color: #666;
    margin-bottom: 20px;
    line-height: 1.8;
}

/* 游戏区域 */
.game-area {
    background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    border-radius: 20px;
    padding: 30px;
    min-height: 400px;
}
.game-title {
    font-size: 22px;
    margin-bottom: 15px;
    text-align: center;
    color: #333;
}

/* 消消乐游戏 */
.match-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 500px;
    margin: 20px auto;
}
.match-item {
    aspect-ratio: 1;
    background: white;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    border: 3px solid transparent;
    user-select: none;
}
.match-item:hover { transform: scale(1.05); }
.match-item.selected {
    border-color: #667eea;
    background: #f5f3ff;
}
.match-item.matched {
    background: #d4edda;
    opacity: 0.5;
    pointer-events: none;
}

/* 口算游戏 */
.math-quiz {
    max-width: 500px;
    margin: 0 auto;
    text-align: center;
}
.math-question {
    font-size: 48px;
    font-weight: bold;
    margin: 30px 0;
    color: #3498db;
}
.math-input {
    width: 200px;
    padding: 15px;
    font-size: 28px;
    text-align: center;
    border: 3px solid #3498db;
    border-radius: 12px;
    outline: none;
}
.math-timer {
    font-size: 20px;
    color: #e74c3c;
    font-weight: bold;
}

/* 首页统计 */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
}
.stat-card {
    padding: 20px;
    border-radius: 16px;
    color: white;
    text-align: center;
}
.stat-card:nth-child(1) { background: linear-gradient(135deg, #ff9a9e, #fad0c4); }
.stat-card:nth-child(2) { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
.stat-card:nth-child(3) { background: linear-gradient(135deg, #d4fc79, #96e6a1); }
.stat-card:nth-child(4) { background: linear-gradient(135deg, #ffecd2, #fcb69f); }
.stat-value { font-size: 36px; font-weight: bold; }
.stat-label { font-size: 14px; opacity: 0.9; margin-top: 5px; }

/* 最近学习 */
.recent-section h3 {
    margin-bottom: 15px;
    color: #555;
}
.recent-list {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.recent-tag {
    padding: 8px 16px;
    background: #f0f0f0;
    border-radius: 20px;
    font-size: 14px;
}

/* 游戏大厅 大卡片样式 */
.game-hall-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
    margin-bottom: 20px;
}
.game-card {
    background: white;
    border-radius: 18px;
    padding: 22px 18px;
    cursor: pointer;
    transition: all 0.3s;
    border: 3px solid transparent;
    position: relative;
    overflow: hidden;
    text-align: center;
}
.game-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 14px 30px rgba(0,0,0,0.18);
}
.game-card::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 100px; height: 100px;
    border-radius: 50%;
    opacity: 0.15;
}
.game-card[data-cat="chinese"]::before { background: #e74c3c; }
.game-card[data-cat="math"]::before { background: #3498db; }
.game-card[data-cat="english"]::before { background: #27ae60; }
.game-card[data-cat="mixed"]::before { background: #9b59b6; }
.game-card[data-cat="chinese"]:hover { border-color: #e74c3c; }
.game-card[data-cat="math"]:hover { border-color: #3498db; }
.game-card[data-cat="english"]:hover { border-color: #27ae60; }
.game-card[data-cat="mixed"]:hover { border-color: #9b59b6; }
.game-card-icon {
    font-size: 52px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
}
.game-card-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
    position: relative;
    z-index: 1;
}
.game-card-desc {
    font-size: 13px;
    color: #777;
    line-height: 1.5;
    position: relative;
    z-index: 1;
}
.game-card-tag {
    display: inline-block;
    margin-top: 10px;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 12px;
    color: white;
    position: relative;
    z-index: 1;
}
.game-card-tag.chinese { background: #e74c3c; }
.game-card-tag.math { background: #3498db; }
.game-card-tag.english { background: #27ae60; }
.game-card-tag.mixed { background: #9b59b6; }

.game-diff-select {
    padding: 10px 16px;
    border-radius: 10px;
    border: 2px solid #9b59b6;
    background: white;
    font-size: 14px;
    margin: 0 8px;
    outline: none;
}

/* 记忆翻牌 */
.memory-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 520px;
    margin: 20px auto;
    perspective: 1000px;
}
.memory-card {
    aspect-ratio: 3/4;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s;
    cursor: pointer;
    user-select: none;
}
.memory-card.flipped { transform: rotateY(180deg); }
.memory-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    padding: 4px;
}
.memory-front {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 40px;
}
.memory-back {
    background: white;
    transform: rotateY(180deg);
    border: 3px solid #ddd;
    color: #333;
}
.memory-card.matched .memory-back {
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    border-color: #00b894;
}

/* 打地鼠 */
.whack-area {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    max-width: 420px;
    margin: 20px auto;
}
.whack-hole {
    aspect-ratio: 1;
    background: radial-gradient(circle at 50% 60%, #6b4f1a, #3d2b0e);
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    border: 6px solid #8b5a2b;
}
.whack-mole {
    position: absolute;
    left: 10%;
    width: 80%;
    height: 80%;
    background: linear-gradient(180deg, #b97a56, #8b5a3c);
    border-radius: 50% 50% 45% 45%;
    bottom: -100%;
    transition: bottom 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: bold;
    color: white;
    text-align: center;
    padding: 5px;
    line-height: 1.1;
}
.whack-hole.up .whack-mole { bottom: 10%; }
.whack-hole.hit .whack-mole {
    background: linear-gradient(180deg, #e74c3c, #c0392b);
    transform: scale(1.1);
}

/* 大转盘 */
.wheel-wrap {
    position: relative;
    width: 360px;
    max-width: 90%;
    aspect-ratio: 1;
    margin: 20px auto;
}
.wheel-svg {
    width: 100%;
    height: 100%;
    transition: transform 4s cubic-bezier(0.15, 0.9, 0.3, 1);
}
.wheel-pointer {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 42px;
    z-index: 2;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
}
.wheel-center-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 72px; height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b6b, #c0392b);
    color: white;
    font-weight: bold;
    border: 4px solid white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    cursor: pointer;
    font-size: 16px;
    z-index: 3;
}
.wheel-center-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* 数字炸弹 */
.bomb-range {
    font-size: 26px;
    font-weight: bold;
    color: #333;
    margin: 16px 0;
}
.bomb-range span {
    display: inline-block;
    padding: 6px 14px;
    background: #ffeaa7;
    border-radius: 10px;
    margin: 0 4px;
    color: #d35400;
}

/* 打字练习 */
.typing-target {
    font-size: 52px;
    font-weight: bold;
    color: #667eea;
    letter-spacing: 8px;
    margin: 20px 0;
    font-family: 'Courier New', monospace;
}
.typing-input {
    font-size: 32px;
    padding: 12px 20px;
    border: 3px solid #667eea;
    border-radius: 12px;
    text-align: center;
    letter-spacing: 6px;
    outline: none;
    font-family: 'Courier New', monospace;
    width: 280px;
}
.typing-char.correct { color: #27ae60; }
.typing-char.wrong { color: #e74c3c; text-decoration: underline wavy; }
.typing-char.current { background: #fff3cd; border-radius: 4px; }

/* 古诗填空 */
.poem-question {
    font-size: 24px;
    line-height: 2;
    margin: 20px 0;
    color: #8e44ad;
}
.poem-blank {
    display: inline-block;
    min-width: 80px;
    border-bottom: 3px dashed #8e44ad;
    margin: 0 6px;
    text-align: center;
    color: #8e44ad;
    font-weight: bold;
}
.poem-option-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    max-width: 600px;
    margin: 10px auto;
}

/* 响应式 */
@media (max-width: 768px) {
    .header { padding: 15px; }
    .header h1 { font-size: 22px; }
    .panel { padding: 20px; }
    .modal-body { padding: 20px; }
    .topic-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .question-text { font-size: 17px; }
    .math-question { font-size: 36px; }
    .game-hall-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .game-card-icon { font-size: 42px; }
    .game-card-name { font-size: 16px; }
    .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .whack-area { gap: 10px; }
}
</style>
</head>
<body>

<div class="app-container">
    <!-- 顶部栏 -->
    <div class="header">
        <div>
            <h1>🎈 小学趣味学习乐园</h1>
            <div class="subtitle">语文 · 数学 · 英语 · 游戏闯关 | 循序渐进 | 自动保存学习进度</div>
        </div>
        <div class="user-info">
            <select class="grade-select" id="gradeSelect">
                <option value="1">📚 一年级</option>
                <option value="2">📖 二年级</option>
                <option value="3">📝 三年级</option>
                <option value="4">✏️ 四年级</option>
                <option value="5">📐 五年级</option>
                <option value="6">🎓 六年级</option>
            </select>
            <div class="progress-bar-container">
                <div class="progress-label">
                    <span>学习进度</span>
                    <span id="progressPercent">0%</span>

    } else {
        // 阅读、写作、综合、园地、其它

    // ===================== 4. 最终组合：如果qBank里有手写→用手写；否则用pool抽10题 =====================
    if (qBank[id]) return qBank[id];

}

    // --- 加减法口算类 (占比最高，所有年级都有) ---

                    else if (t===4) { qs.push({q:'几成表示十分之几，也表示百分之几十。二成=？',options:['2%','20%','50%','10%'],correct:1,explain:'二成=十分之二=20%'}); }
                    else { qs.push({q:'应纳税额与各种收入的比率叫？',options:['税率','利率','折扣','成数'],correct:0,explain:'税率=应纳税额÷收入'}); }
                }
                return qs;
            }
            if (/分数.*解决.*问题|单位.*1|已知.*单.*位.*1|求.*单.*位.*1|量.*率.*对.*应|几.*分.*之.*几.*对.*应|画.*线.*段.*图|分.*数.*除.*法.*应.*用|乘.*除.*联.*系|分.*数.*乘.*法.*应.*用|分.*数.*除.*法.*问.*题|量.*率.*问.*题|.*多.*几.*分.*之.*几.*少.*几.*分.*之.*几|.*单.*位.*".*1.*"|.*已.*知.*单.*位.*"1.*".*用.*乘.*|.*未.*知.*单.*位.*"1.*".*用.*除|数.*量.*关.*系.*线.*段.*图|列.*式.*计.*算.*应.*用.*题|.*工.*程.*问.*题.*相.*遇.*问.*题|工.*作.*效.*率.*工.*作.*总.*量|工.*作.*时.*间|.*水.*泥.*运.*走.*几.*分.*之.*几|故.*事.*书.*已.*看.*剩.*下.*|.*工.*程.*问.*题|两.*车.*相.*遇|路.*程.*速.*度.*时.*间|.*工.*作.*效.*率.*之.*和/.test(topicName)) {

                    else if (t===3) { const boys=rand(20,40), girls=Math.round(boys*(1+[0.2,0.25,0.5,0.4][rand(0,3)])); qs.push(_mcq(`男生${boys}人，女生比男生多1/5，女生几人？(取整)`, Math.round(boys*1.2), `女生=${boys}×(1+1/5)=${Math.round(boys*1.2)}人`, -20, 20)); }
                    else { const total=rand(40,200), kg=rand(2,9), den=rand(5,15); const ans=Math.round(total*kg/den); qs.push(_mcq(`一堆煤${total}吨，第一次运走${kg}/${den}，运走了多少吨？(取整)`, ans, `${total}×${kg}/${den}=${ans}吨`, -10, 10)); }
                }
                return qs;

            // 图形·观察·对称·平移·旋转·统计图·搭配·广角·总复习 全在这里做一个"综合10题"兜底
            const fallback = [

                {q:'折线统计图优点是？',ans:'反映变化趋势',opts:['比较多少','反映变化趋势','看占比','没优点'],exp:'折线：看数量增减变化'},
                {q:'平均数：1,2,3的平均数是？',ans:2,opts:[1,2,3,6],exp:'(1+2+3)÷3=2'},

                {q:'抽屉原理：把5个苹果放4个抽屉，至少有1个抽屉放几个？',ans:2,opts:[1,2,3,5],exp:'5÷4=1余1 → 至少1+1=2个'},
            ];
            return shuffle(fallback.map(it => {
                const opts = [...it.opts].sort(()=>Math.random()-0.5);
                return {q:it.q, options:opts.map(String), correct:opts.indexOf(it.ans), explain:it.exp};
            }));
        }
    }
    // 兜底通用题（与年级匹配的口算10题）
    for (let i=0; i<n; i++) {
        if (grade <= 2) { const a=rand(1,99),b=rand(1,99); if (Math.random()<0.5) qs.push(_mcq(`${a}+${b}=?`,a+b,`${a}+${b}=${a+b}`,-10,10)); else { if(a<b)[a,b]=[b,a]; qs.push(_mcq(`${a}-${b}=?`,a-b,`${a}-${b}=${a-b}`,-10,10)); } }
        else if (grade<=4) { const a=rand(2,99),b=rand(2,9); qs.push(_mcq(`${a}×${b}=?`,a*b,`${a}×${b}=${a*b}`,-30,30)); }
        else { const a=rand(3,15),b=rand(3,15); qs.push(_mcq(`${a}×${b}=?`,a*b,`${a}×${b}=${a*b}`,-20,20)); }
    }
    return qs;
}

    // 2.3 情景交际·对话题池
    const dialogueQs = [

    // ===================== 3. 正则路由：从ENGLISH_TOPICS中取name+desc匹配 =====================
    let nameAndDesc = '';
    const gradeList = ENGLISH_TOPICS[g] || [];
    for (const t of gradeList) { if (t.id === id) { nameAndDesc = t.name + ' ' + t.desc; break; } }
    if (!nameAndDesc) {
        outer: for (const gg in ENGLISH_TOPICS) for (const t of ENGLISH_TOPICS[gg]) {
            if (t.id === id) { nameAndDesc = t.name + ' ' + t.desc; break outer; }
        }
    }

    let pool;
    if (/字母|ABC|abc|字母发音|音标|元音|辅音|大小写|拼写规则|首字母|a|an|the定冠词/.test(nameAndDesc)) {
        pool = letterQs;
    } else if (/词汇|单词|数字|颜色|家庭|动物|食物|水果|文具|身体部位|季节|月份|星期|天气|服饰|交通|职业|节日|地点|教室|房间|农场|公园|爱好|运动|乐器|国家|语言|标志|指示代词|人称代词|物主代词|反身代词|量词|名词单复数|所有格/.test(nameAndDesc)) {
        pool = vocabQs;
    } else if (/问候|日常交际|礼貌用语|打电话|购物|问路|看病|饭店点餐|图书馆|失物招领|建议提建议|邀请|告别|祝福|道歉|道谢|自我介绍|介绍他人|拜访|情景|对话|口语|topic|话题|talk|say|tell|speak|tell story|duty report/.test(nameAndDesc)) {
        pool = dialogueQs;
    } else if (/时态|一般现在|三单|现在进行|一般过去|一般将来|过去进行|现在完成|比较级|最高级|There be|情态动词|can|may|must|should|冠词|介词|in|on|at|by|for|from|to|with|代词|名词|数词|冠词|连词|and|but|or|so|because|if|when|while|被动|定语从句|宾语从句|状语从句|主谓一致|非谓语|doing|done|to do|祈使句|感叹句|反义疑问/.test(nameAndDesc)) {
        pool = grammarQs;
    } else if (/句型|对划线|一般疑问|特殊疑问|选择疑问|反义疑问|否定句|同义句|翻译|中英互译|连词成句|改错|句子排序|合并句子|扩句|缩句/.test(nameAndDesc)) {
        pool = sentenceQs;
    } else {
        // 阅读·写作·综合·复习
        pool = readWriteQs;
    }

    // ===================== 4. 最终组合：手写→池抽10题 =====================
    if (qBank[id]) return qBank[id];
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, 10);
}

let currentSession = null;
function openStudyModal(subject, topic) {
    let questions;
    if (subject === 'chinese') questions = generateChineseQuestions(topic.id, appState.currentGrade);
    else if (subject === 'math') questions = generateMathQuestions(topic.id, appState.currentGrade);
    else questions = generateEnglishQuestions(topic.id, appState.currentGrade);

    currentSession = {
        subject, topic,
        questions: questions,
        currentIndex: 0,
        answers: new Array(questions.length).fill(null), // null / {chosen, correct}
        score: 0,
    };

    const headerMap = { chinese: 'chinese', math: 'math', english: 'english' };
    document.getElementById('modalHeader').className = 'modal-header ' + headerMap[subject];
    document.getElementById('modalTitle').textContent = `${topic.icon} ${topic.name}`;
    document.getElementById('studyModal').classList.add('show');

    renderQuestion();
}

function renderQuestion() {
    const s = currentSession;
    const q = s.questions[s.currentIndex];
    const ans = s.answers[s.currentIndex];
    const modalBody = document.getElementById('modalBody');

    const optionsHtml = q.options.map((opt, i) => {
        let cls = 'option-btn';
        let disabled = '';
        if (ans) {
            disabled = 'disabled';
            if (i === q.correct) cls += ' correct';
            else if (i === ans.chosen) cls += ' wrong';
        }
        const letter = ['A','B','C','D'][i];
        return `<button class="${cls}" data-index="${i}" ${disabled}>
            <strong style="margin-right:8px">${letter}.</strong>${opt}
        </button>`;
    }).join('');

    const explainHtml = ans ? `<div class="explanation show">💡 <strong>解析：</strong>${q.explain}</div>`
                            : `<div class="explanation"></div>`;

    modalBody.innerHTML = `
        <div class="question-area">
            <div class="question-meta">
                <span>📌 第 ${s.currentIndex + 1} 题 / 共 ${s.questions.length} 题</span>
                <span>📚 ${s.subject === 'chinese' ? '语文' : s.subject === 'math' ? '数学' : '英语'}</span>
            </div>
            <div class="question-text">${q.q}</div>
            <div class="options-grid">${optionsHtml}</div>
            ${explainHtml}
        </div>
    `;

    // 绑定选项
    modalBody.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => onAnswer(parseInt(btn.dataset.index)));
    });

    // 导航
    document.getElementById('questionIndicator').textContent = `${s.currentIndex + 1} / ${s.questions.length}`;
    document.getElementById('prevQuestion').disabled = s.currentIndex === 0;
    const nextBtn = document.getElementById('nextQuestion');
    if (s.currentIndex === s.questions.length - 1) {
        const allAnswered = s.answers.every(a => a);
        nextBtn.textContent = allAnswered ? '🎉 完成测试' : '下一题 ➡';
        nextBtn.disabled = !allAnswered;
    } else {
        nextBtn.textContent = '下一题 ➡';
        nextBtn.disabled = false;
    }

    // 计算实时分数
    let correctCount = s.answers.filter(a => a && a.correct).length;
    let answeredCount = s.answers.filter(a => a).length;
    let realScore = answeredCount > 0 ? Math.round(correctCount / answeredCount * 100) : 0;
    document.getElementById('scoreDisplay').textContent = '⭐ ' + realScore;
}

function onAnswer(chosen) {
    const s = currentSession;
    if (s.answers[s.currentIndex]) return;
    const q = s.questions[s.currentIndex];
    const correct = chosen === q.correct;
    s.answers[s.currentIndex] = { chosen, correct };
    renderQuestion();
}

function closeStudyModal() {
    document.getElementById('studyModal').classList.remove('show');
    currentSession = null;
}

function submitQuiz() {
    const s = currentSession;
    const correctCount = s.answers.filter(a => a && a.correct).length;
    const total = s.questions.length;
    const score = Math.round(correctCount / total * 100);

    // 保存成绩
    appState.completed[s.topic.id] = {
        score, answered: correctCount, total,
        time: Date.now(),
    };

    // 达到60分以上，加星星奖励
    if (score >= 60) {
        let stars = 1;
        if (score >= 80) stars = 2;
        if (score >= 100) stars = 3;
        appState.stars += stars;
        showReward(score, stars);
    } else {
        alert(`本次得分 ${score}分（答对 ${correctCount}/${total}）\n💪 再接再厉，加油！`);
    }

    // 最近学习
    appState.recent.unshift({ subject: s.subject, topicName: s.topic.name, score, time: Date.now() });
    appState.recent = appState.recent.slice(0, 10);

    saveState();
    closeStudyModal();
    renderAllSubjects();
}

function showReward(score, stars) {
    let emoji = '🎉';
    let title = '太棒了！';
    let msg = '';
    if (score === 100) {
        emoji = '🏆'; title = '满分通过！';
        msg = '你真是个小学霸！全部题目都答对了，太厉害了！';
    } else if (score >= 90) {
        emoji = '🌟'; title = '优秀！';
        msg = '非常棒！继续保持，你离满分就差一点点啦！';
    } else if (score >= 80) {
        emoji = '😊'; title = '做得很好！';
        msg = '表现不错，巩固一下，下次争取满分！';
    } else {
        emoji = '💪'; title = '合格啦！';
        msg = '及格啦！多多练习，你会越来越棒的！';
    }
    document.getElementById('rewardEmoji').textContent = emoji;
    document.getElementById('rewardTitle').textContent = title;
    document.getElementById('rewardStars').textContent = '⭐'.repeat(stars) + ' 获得 ' + stars + ' 颗星';
    document.getElementById('rewardMessage').textContent = msg + `\n得分：${score}分`;
    document.getElementById('rewardModal').classList.add('show');
}

function calcStars(correct, total, extraGood=false) {
    if (total <= 0) return 0;
    const rate = correct / total;
    let s = 0;
    if (rate >= 1 && extraGood) s = 5;
    else if (rate >= 0.95) s = 5;
    else if (rate >= 0.8) s = 3;
    else if (rate >= 0.6) s = 2;
    else if (rate >= 0.4) s = 1;
    return s;
}

function startMatchGame(subject) {
    const pairs = [...MATCH_GAMES[subject]];

    renderMatchGame();
}
function renderMatchGame() {
    const container = document.getElementById('gameContainer');

function onMatchItemClick(idx) {
    if (gameState.matched.has(idx)) return;
    if (gameState.selected === idx) return;
    if (gameState.selected === null) {
        gameState.selected = idx;
        renderMatchGame();
        return;
    }
    const a = gameState.items[gameState.selected];
    const b = gameState.items[idx];
    gameState.moves++;
    if (a.match === b.value && a.type !== b.type) {
        gameState.matched.add(gameState.selected);
        gameState.matched.add(idx);
        gameState.selected = null;
        renderMatchGame();
        if (gameState.matched.size === gameState.items.length) {
            const time = Math.round((Date.now() - gameState.startTime)/1000);
            const stars = Math.max(1, 6 - Math.floor(gameState.moves/4));

                    `⏱️ 用时：<b>${time}</b> 秒`,

                    `📦 配对数量：<b>${gameState.items.length/2}</b> 对`,
                ], Math.min(5, stars));
            }, 300);
        }
    } else {
        const prev = gameState.selected;
        const el1 = document.querySelectorAll('.match-item')[prev];

        if (el1) el1.style.background = '#f8d7da';

function startMathRace() {
    gameState = { type: 'race', correct: 0, wrong: 0, answered: 0, timeLeft: 60, current: null };
    renderRaceQuestion();
    gameState._timer = setInterval(() => {
        gameState.timeLeft--;
        const el = document.querySelector('.math-timer');
        if (gameState.timeLeft <= 0) { clearInterval(gameState._timer); finishRace(); }
        else if (el) el.textContent = '⏱️ ' + gameState.timeLeft + '秒';
    }, 1000);
}
function genRaceQuestion() {
    const grade = appState.currentGrade;
    if (grade <= 2) {
        const a = rand(1, 20), b = rand(1, 20);
        if (Math.random() > 0.5) return { q: `${a} + ${b}`, a: a + b };
        const [x, y] = a >= b ? [a, b] : [b, a];
        return { q: `${x} - ${y}`, a: x - y };
    } else if (grade <= 4) {
        const type = rand(0, 2);
        if (type === 0) { const a=rand(2,12), b=rand(2,12); return { q:`${a} × ${b}`, a:a*b }; }
        if (type === 1) { const b=rand(2,12), a=b*rand(2,12); return { q:`${a} ÷ ${b}`, a:a/b }; }
        const a=rand(10,100), b=rand(10,100);
        return Math.random()>0.5 ? {q:`${a}+${b}`, a:a+b} : {q:`${a>b?a:b}-${a>b?b:a}`, a:Math.abs(a-b)};
    } else {
        const a=rand(10,99), b=rand(2,20);
        const type=rand(0,2);
        if (type===0) return {q:`${a} × ${b}`, a:a*b};
        if (type===1) { const x=b*rand(2,20); return {q:`${x} ÷ ${b}`, a:x/b}; }
        const c = rand(10, 99);
        return {q:`${a} + ${b} + ${c}`, a:a+b+c};
    }
}
function renderRaceQuestion() {
    gameState.current = genRaceQuestion();
    const container = document.getElementById('gameContainer');
    container.innerHTML = `
        <div class="math-quiz">
            <div style="display:flex;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">

            <div class="math-question">${gameState.current.q} = ?</div>
            <input class="math-input" id="raceInput" type="number" placeholder="答案" autofocus>
            <div style="margin-top:20px">
                <button class="btn btn-success" onclick="submitRaceAnswer()" style="font-size:18px;padding:14px 30px">✅ 确认答案 (回车)</button>
            </div>
            <div style="margin-top:20px">
                <button class="btn btn-warning" onclick="stopRace()">⏹ 结束</button>
            </div>
        </div>
    `;
    const input = document.getElementById('raceInput');
    setTimeout(()=>input && input.focus(), 0);
    input && input.addEventListener('keydown', e => { if (e.key === 'Enter') submitRaceAnswer(); });
}
function submitRaceAnswer() {
    const input = document.getElementById('raceInput');
    if (!input) return;
    const val = parseInt(input.value);
    if (isNaN(val)) { input.value=''; return; }
    gameState.answered++;
    if (val === gameState.current.a) gameState.correct++;
    else gameState.wrong++;
    renderRaceQuestion();
}
function stopRace() {
    if (gameState._timer) clearInterval(gameState._timer);
    finishRace();
}
function finishRace() {
    if (gameState.type !== 'race') return;
    const correct = gameState.correct;
    const answered = gameState.answered || 1;
    const rate = Math.round(correct/answered*100);
    const stars = calcStars(correct, answered, correct>=30 && rate>=90);
    finishGameResult('挑战结束！', stars>=3 ? '🏆' : stars>=1 ? '🎉' : '💪', [
        `✅ 答对：<b style="color:#27ae60">${correct}</b> 题`,

}

function popWhackMole() {
    // 选择空格子弹出
    const empty = [];
    gameState.holes.forEach((h, i) => { if (!h || Date.now()-h.t>1400) empty.push(i); });
    if (!empty.length) return;
    const idx = empty[rand(0, empty.length-1)];

    if (gameState.cat === 'chinese') {
        const d = WHACK_CN_WORDS[rand(0, WHACK_CN_WORDS.length-1)];
        q = `找出汉字：${d.t}`;
        opts = shuffle([...d.w]);
        ans = d.t;
    } else if (gameState.cat === 'english') {
        const d = WHACK_EN_WORDS[rand(0, WHACK_EN_WORDS.length-1)];
        q = `中文：${d.t}`;
        opts = shuffle([...d.w]);
        ans = d.w[0];

        q = `${p.q} = ?`;

        while (r.size < 4) r.add(p.a + rand(-6,6));
        opts = shuffle([...r].map(x=>x.toString()));
        ans = p.a.toString();
    }
    const correctHole = rand(0, 8);
    // 保证 correctHole 上放正确答案，其他随机
    const usedOpts = new Set([ans]);
    gameState.holes.forEach((_, i) => {
        if (i === correctHole) {
            gameState.holes[i] = { text: ans, correct: true, t: Date.now() };
        } else {
            let fake;
            const pool = opts.filter(o => o !== ans && !usedOpts.has(o));
            if (pool.length) fake = pool[rand(0, pool.length-1)];
            else { fake = (parseInt(ans)||0) + rand(-20,20); fake = fake.toString(); usedOpts.add(fake); }
            gameState.holes[i] = { text: fake, correct: false, t: Date.now() };

    gameState.ans = ans;

function startPoemGame() {
    const selected = shuffle([...POEMS]).slice(0, 8);
    gameState = { type:'poem', list:selected, i:0, correct:0, wrong:0 };
    renderPoem();
}
function renderPoem() {
    const container = document.getElementById('gameContainer');
    const q = gameState.list[gameState.i];
    const poemHtml = q.q[0].replace('____', `<span class="poem-blank">？？？</span>`);
    const optsHtml = q.opts.map((o, i) => {
        const cls = gameState.picked === i ? (i === q.ans ? 'btn-success' : 'btn-danger') : 'btn-primary';
        const dis = gameState.picked != null ? 'disabled' : '';
        return `<button class="btn ${cls}" style="font-size:17px;padding:12px 20px" ${dis} onclick="poemPick(${i})">${o}</button>`;
    }).join('');
    container.innerHTML = `
        <div style="max-width:600px;margin:0 auto;text-align:center">
            <div class="game-title">📜 古诗填空闯关 · 第 ${gameState.i+1} / ${gameState.list.length} 题</div>
            <div style="display:flex;justify-content:center;gap:25px;margin-bottom:15px;font-size:15px;flex-wrap:wrap">
                <span style="color:#27ae60"><b>✅ ${gameState.correct}</b></span>
                <span style="color:#e74c3c"><b>❌ ${gameState.wrong}</b></span>
            </div>
            <div class="poem-question">${poemHtml}</div>
            <div class="poem-option-row" style="margin-top:20px">${optsHtml}</div>
            ${gameState.picked != null ? `
                <div style="margin-top:20px;padding:15px 20px;background:${gameState.picked===q.ans?'#d4edda':'#f8d7da'};color:${gameState.picked===q.ans?'#155724':'#721c24'};border-radius:12px;text-align:left;font-size:15px;line-height:1.8">
                    <b>${gameState.picked===q.ans?'✅ 答对了！':'❌ 答错了'}</b><br>
                    📖 完整诗句：<b>${q.full}</b>
                </div>
                <div style="margin-top:20px">
                    <button class="btn btn-primary" onclick="poemNext()" style="font-size:16px;padding:12px 24px">
                        ${gameState.i===gameState.list.length-1 ? '🏆 查看结果' : '➡ 下一题'}
                    </button>
                </div>
            ` : ''}
            <div style="margin-top:25px">
                <button class="btn btn-info" onclick="renderGamePanel()">🏠 返回大厅</button>
            </div>
        </div>
    `;
}
function poemPick(i) {
    if (gameState.picked != null) return;
    gameState.picked = i;
    if (i === gameState.list[gameState.i].ans) gameState.correct++;
    else gameState.wrong++;
    renderPoem();
}

function startTyping() {
    const grade = Math.min(3, Math.max(1, appState.currentGrade <= 2 ? 1 : appState.currentGrade <= 4 ? 2 : 3));
    gameState = {
        type:'typing', words:[...TYPING_LEVELS[grade]],
        i:0, input:'', correct:0, wrong:0, totalChars:0, typedChars:0,
        start:Date.now(), timeLimit:90, time:90
    };
    renderTyping();
    gameState._timer = setInterval(() => {
        gameState.time--;
        if (gameState.time <= 0) { clearInterval(gameState._timer); finishTyping(); return; }
        const tEl = document.getElementById('typingTime');
        if (tEl) tEl.textContent = '⏱️ ' + gameState.time + 's';
    }, 1000);
}
function renderTyping() {
    const container = document.getElementById('gameContainer');
    const target = gameState.words[gameState.i] || '';
    // 字符彩色反馈
    const charsHtml = target.split('').map((ch, ci) => {
        let cls = '';
        if (ci < gameState.typedChars) cls = gameState.input[ci] === ch ? 'correct' : 'wrong';
        else if (ci === gameState.typedChars) cls = 'current';
        return `<span class="typing-char ${cls}">${ch}</span>`;
    }).join('');
    container.innerHTML = `
        <div style="text-align:center;max-width:550px;margin:0 auto">
            <div class="game-title">⌨️ 打字练习小能手</div>

                <span style="color:#27ae60"><b>✅ 单词 ${gameState.correct}</b></span>
                <span style="color:#e74c3c"><b>❌ ${gameState.wrong}</b></span>
                <span style="color:#666">进度 <b>${gameState.i}/${gameState.words.length}</b></span>
            </div>
            <div style="font-size:14px;color:#888;margin-bottom:10px">📚 难度等级：${['入门','进阶','挑战'][gradeIdx_fix()]}（按年级自动匹配）</div>
            <div class="typing-target">${charsHtml}</div>
            <input id="typingInput" class="typing-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                placeholder="输入上方单词">
            <div style="margin-top:20px">
                <button class="btn btn-warning" onclick="if(gameState._timer)clearInterval(gameState._timer);startTyping()">🔄 重新开始</button>
                <button class="btn btn-info" onclick="if(gameState._timer)clearInterval(gameState._timer);renderGamePanel()">🏠 返回大厅</button>
            </div>
        </div>
    `;
    const inp = document.getElementById('typingInput');
    setTimeout(()=>inp && inp.focus(), 0);
    inp && inp.addEventListener('input', onTypingInput);
}
function gradeIdx_fix() {
    return Math.min(2, appState.currentGrade <= 2 ? 0 : appState.currentGrade <= 4 ? 1 : 2);
}
function onTypingInput(e) {
    const val = e.target.value;
    const target = gameState.words[gameState.i];
    gameState.input = val;
    gameState.typedChars = val.length;
    if (val.length >= target.length) {
        // 判断完成
        if (val === target) gameState.correct++;
        else gameState.wrong++;
        gameState.i++;
        gameState.input = '';
        gameState.typedChars = 0;
        if (gameState.i >= gameState.words.length) {
            clearInterval(gameState._timer);
            finishTyping();
            return;
        }
    }
    renderTyping();
}
function finishTyping() {
    const done = gameState.correct + gameState.wrong || 1;
    const rate = Math.round(gameState.correct / done * 100);
    const sec = 90 - gameState.time;
    const wpm = Math.round(gameState.correct / Math.max(1, sec/60));
    const stars = calcStars(gameState.correct, gameState.words.length, rate>=90 && wpm>=5);
    finishGameResult('⌨️ 打字练习结束！', stars>=3 ? '🏆' : '🎉', [
        `✅ 打对：<b style="color:#27ae60">${gameState.correct}</b> 个单词`,
        `❌ 打错：<b style="color:#e74c3c">${gameState.wrong}</b> 个`,
        `📝 词库：<b>${gameState.words.length}</b> 个单词`,
        `⏱️ 用时：<b>${sec}</b> 秒`,
        `🚀 速度：<b>${wpm}</b> 词/分钟`,
        `🎯 正确率：<b>${rate}%</b>`,
    ], stars);
}

];
function startJielong() {
    const data = CHENGYU_JIELONG[rand(0, CHENGYU_JIELONG.length-1)];
    const all = [data.first, ...data.chain];
    // 生成 4 题：每题给 4 选项，其中一个接得上
    const qs = [];
    for (let i=0;i<Math.min(4, data.chain.length);i++) {
        const prev = all[i];
        const answer = data.chain[i];
        const lastCh = prev[prev.length-1];
        // 生成3个干扰
        const fakes = new Set();
        while (fakes.size < 3) {
            const cy = [...CHENGYU_JIELONG.flatMap(c=>c.chain)][rand(0,CHENGYU_JIELONG.flatMap(c=>c.chain).length-1)];
            if (cy !== answer && !fakes.has(cy)) fakes.add(cy);
        }
        const opts = shuffle([answer, ...fakes]);
        qs.push({prev, answer, opts, full:`${prev} → ${answer}`});
    }
    gameState = { type:'jielong', qs, i:0, correct:0, picked:null };
    renderJielong();
}
function renderJielong() {
    const container = document.getElementById('gameContainer');

            if (idx === q.opts.indexOf(q.answer)) cls = 'btn-success';
            else if (idx === gameState.picked) cls = 'btn-danger';
        }
        return `<button class="btn ${cls}" ${gameState.picked!=null?'disabled':''} onclick="jielongPick(${idx})" style="font-size:16px;padding:12px 20px;margin:6px">${o}</button>`;
    }).join('');
    container.innerHTML = `
        <div style="max-width:600px;margin:0 auto;text-align:center">

                <div style="margin-top:15px;padding:15px;border-radius:12px;background:${gameState.picked===q.opts.indexOf(q.answer)?'#d4edda':'#f8d7da'};color:${gameState.picked===q.opts.indexOf(q.answer)?'#155724':'#721c24'};text-align:left">
                    <b>${gameState.picked===q.opts.indexOf(q.answer)?'✅ 接对了！':'❌ 接错了'}</b><br>
                    📖 正确接龙：<b>${q.full}</b>
                </div>
                <div style="margin-top:20px">
                    <button class="btn btn-primary" onclick="jielongNext()" style="font-size:16px;padding:12px 24px">
                        ${gameState.i===gameState.qs.length-1 ? '🏆 查看结果' : '➡ 下一题'}
                    </button>
                </div>
            ` : ''}
            <div style="margin-top:20px">
                <button class="btn btn-info" onclick="renderGamePanel()">🏠 返回大厅</button>
            </div>
        </div>
    `;
}
function jielongPick(i) {
    if (gameState.picked != null) return;
    gameState.picked = i;
    const q = gameState.qs[gameState.i];
    if (q.opts[i] === q.answer) gameState.correct++;
    renderJielong();
}
function jielongNext() {
    gameState.picked = null;
    if (gameState.i >= gameState.qs.length - 1) {
        const stars = calcStars(gameState.correct, gameState.qs.length, gameState.correct===gameState.qs.length);
        finishGameResult('🐉 成语接龙结束！', stars>=3 ? '🏆' : '🎉', [

}

function startWheelGame() {

    renderWheel();
}
function renderWheel() {
    const container = document.getElementById('gameContainer');
    const cats = ['语文','语文','数学','数学','英语','英语','综合','综合'];
    const colors = ['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#ff9ff3','#54a0ff','#5f27cd','#ff9f43'];
    const n = cats.length;
    const anglePer = 360 / n;
    let paths = '';
    let texts = '';
    const R = 160, cx = 180, cy = 180;
    cats.forEach((c, i) => {
        const a1 = (i * anglePer - 90) * Math.PI / 180;
        const a2 = ((i+1) * anglePer - 90) * Math.PI / 180;
        const x1 = cx + R*Math.cos(a1), y1 = cy + R*Math.sin(a1);
        const x2 = cx + R*Math.cos(a2), y2 = cy + R*Math.sin(a2);
        const large = anglePer > 180 ? 1 : 0;
        paths += `<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} Z" fill="${colors[i]}" stroke="white" stroke-width="3"></path>`;
        // 文字位置
        const ta = ((i+0.5)*anglePer - 90) * Math.PI / 180;
        const tx = cx + (R*0.62) * Math.cos(ta);
        const ty = cy + (R*0.62) * Math.sin(ta);
        const rot = (i+0.5)*anglePer;
        texts += `<text x="${tx}" y="${ty}" font-size="18" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle" transform="rotate(${rot} ${tx} ${ty})">${c}</text>`;
    });
    const qHtml = gameState.q ? `
        <div style="max-width:500px;margin:20px auto 10px;background:#fff3cd;padding:15px 20px;border-radius:14px;text-align:left;line-height:1.7">
            <div style="font-size:15px;color:#856404;margin-bottom:6px">🎯 【${gameState.q.cat}】第 ${gameState.rounds}/${gameState.maxRounds} 轮</div>
            <div style="font-size:17px;font-weight:bold;color:#5b4700">${gameState.q.q}</div>
            <div style="margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px">
                ${gameState.q.opts.map((o,i)=>{
                    let cls = 'btn-primary';
                    if (gameState.picked!=null) {
                        if (i === gameState.q.ans) cls = 'btn-success';
                        else if (i === gameState.picked) cls = 'btn-danger';
                    }
                    return `<button class="btn ${cls}" ${gameState.picked!=null?'disabled':''} onclick="wheelPick(${i})">${String.fromCharCode(65+i)}. ${o}</button>`;
                }).join('')}
            </div>
        </div>
        <div style="margin-top:10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            ${gameState.picked!=null ? `<button class="btn btn-primary" onclick="wheelNext()" style="font-size:16px;padding:12px 24px">${gameState.rounds>=gameState.maxRounds?'🏆 查看结果':'🎡 继续转下一题'}</button>` : ''}
            <button class="btn btn-info" onclick="renderGamePanel()">🏠 返回大厅</button>
        </div>
    ` : '';
    container.innerHTML = `
        <div style="width:100%;text-align:center">
            <div class="game-title">🎡 知识幸运大转盘</div>
            <div style="font-size:14px;color:#666;margin-bottom:5px">
                点击「GO」转动转盘 · 答对 <b style="color:#27ae60">${gameState.correct}</b> / 共 <b>${gameState.rounds}</b> 题 · 共 5 轮
            </div>
            <div class="wheel-wrap">
                <div class="wheel-pointer">▼</div>
                <svg class="wheel-svg" viewBox="0 0 360 360" style="transform:rotate(${gameState.rot}deg)">
                    <circle cx="180" cy="180" r="175" fill="white" stroke="#eee" stroke-width="4"></circle>
                    ${paths}
                    ${texts}
                </svg>
                <button class="wheel-center-btn" id="wheelBtn" onclick="wheelSpin()" ${gameState.running||gameState.q&&gameState.picked==null?'disabled':''}>
                    ${gameState.running ? '转动中' : 'GO!'}
                </button>
            </div>
            ${qHtml}
        </div>
    `;
}
function wheelSpin() {
    if (gameState.running) return;
    if (gameState.rounds >= gameState.maxRounds) {
        wheelFinish(); return;
    }
    gameState.running = true;
    const spin = 360 * (4 + Math.random()*2) + rand(0, 359);
    gameState.rot += spin;
    renderWheel();
    setTimeout(() => {
        gameState.running = false;
        // 根据落点选分类
        const final = (gameState.rot % 360 + 360) % 360;
        // 指针在上方(0度/12点方向)，反向减，逆时针
        const idx = Math.floor(((360 - final) % 360) / 45) % 8;
        const cats = ['语文','语文','数学','数学','英语','英语','综合','综合'];
        const cat = cats[idx];
        // 抽对应分类的题
        const pool = WHEEL_QUESTIONS.filter(q => q.cat === cat);
        const pick = pool[rand(0, pool.length-1)];
        gameState.q = pick;
        gameState.picked = null;
        gameState.rounds++;
        renderWheel();
    }, 4100);
}
function wheelPick(i) {
    if (gameState.picked != null) return;
    gameState.picked = i;
    if (i === gameState.q.ans) gameState.correct++;
    renderWheel();
}
function wheelNext() {
    if (gameState.rounds >= gameState.maxRounds) { wheelFinish(); return; }
    gameState.q = null;
    gameState.picked = null;
    renderWheel();
}
function wheelFinish() {
    const stars = calcStars(gameState.correct, gameState.maxRounds, gameState.correct===gameState.maxRounds);
    finishGameResult('🎡 幸运大转盘结束！', stars>=3 ? '🏆' : '🎉', [
        `✅ 答对：<b style="color:#27ae60">${gameState.correct}</b> 题`,
        `❌ 答错：<b style="color:#e74c3c">${gameState.rounds - gameState.correct}</b> 题`,
        `📝 共转了 <b>${gameState.rounds}</b> 轮`,
        `🎯 正确率：<b>${Math.round(gameState.correct/gameState.rounds*100)}%</b>`,
    ], stars);
}

/* ==================== 工具函数 ==================== */
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}
function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

/* ==================== 导入导出 ==================== */

function exportProgress() {
    const data = JSON.stringify(appState, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const pad = n => n.toString().padStart(2, '0');
    a.download = `小学学习进度_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.json`;
    a.href = url;
    a.click();
    URL.revokeObjectURL(url);
}

function importProgress(file) {
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);
            if (typeof data === 'object' && data.completed) {
                if (confirm('确定要覆盖当前进度吗？')) {
                    appState = Object.assign(appState, data);
                    saveState();
                    document.getElementById('gradeSelect').value = appState.currentGrade;
                    renderAllSubjects();
                    renderGamePanel();
                    alert('✅ 进度导入成功！');
                }
            } else {
                alert('❌ 文件格式不正确');
            }
        } catch(err) {
            alert('❌ 导入失败：' + err.message);
        }
    };
    reader.readAsText(file);
}

/* ==================== 初始化与事件绑定 ==================== */

function init() {
    loadState();
    document.getElementById('gradeSelect').value = appState.currentGrade;
    renderAllSubjects();
    renderGamePanel();

    // Tab切换
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            ['chinese', 'math', 'english', 'game'].forEach(p => {
                document.getElementById(p + 'Panel').classList.toggle('hidden', p !== tab.dataset.tab);
            });
        });
    });

    // 年级选择
    document.getElementById('gradeSelect').addEventListener('change', e => {
        appState.currentGrade = parseInt(e.target.value);
        saveState();
        renderAllSubjects();
    });

    // 模态框关闭
    document.getElementById('modalClose').addEventListener('click', closeStudyModal);
    document.getElementById('studyModal').addEventListener('click', e => {
        if (e.target.id === 'studyModal') closeStudyModal();
    });
    document.getElementById('prevQuestion').addEventListener('click', () => {
        if (!currentSession) return;
        if (currentSession.currentIndex > 0) {
            currentSession.currentIndex--;
            renderQuestion();
        }
    });
    document.getElementById('nextQuestion').addEventListener('click', () => {
        if (!currentSession) return;
        const s = currentSession;
        if (s.currentIndex === s.questions.length - 1) {
            if (s.answers.every(a => a)) {
                submitQuiz();
            }
            return;
        }
        s.currentIndex++;
        renderQuestion();
    });

    document.getElementById('rewardClose').addEventListener('click', () => {
        document.getElementById('rewardModal').classList.remove('show');
    });

    // 导入导出重置
    document.getElementById('exportBtn').addEventListener('click', exportProgress);
    document.getElementById('importBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', e => {
        if (e.target.files[0]) importProgress(e.target.files[0]);
        e.target.value = '';
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm('⚠️ 确定要清空所有学习进度吗？\n此操作不可恢复！')) {
            if (confirm('再次确认：真的要重置所有进度吗？')) {
                localStorage.removeItem(STORAGE_KEY);
                appState = {
                    currentGrade: 1, stars: 0, completed: {},
                    recent: [], createdAt: Date.now(),
                };
                saveState();
                document.getElementById('gradeSelect').value = 1;
                renderAllSubjects();
                renderGamePanel();
                alert('✅ 已重置');
            }
        }
    });
}

// 页面加载完成自动初始化
document.addEventListener('DOMContentLoaded', init);
// 兼容可能加载慢的情况
if (document.readyState === 'interactive' || document.readyState === 'complete') {
    init();
}
</script>

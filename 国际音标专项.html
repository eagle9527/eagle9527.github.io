<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国际音标专项学习</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #eef6ff 0%, #f8f2ff 50%, #fff8ef 100%);
    color: #1f2d3d;
    min-height: 100vh;
}
.page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
}
.hero {
    background: rgba(255,255,255,0.96);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 16px 40px rgba(31,45,61,0.08);
    margin-bottom: 20px;
}
.hero h1 {
    font-size: 34px;
    margin-bottom: 10px;
    color: #0f6cbd;
}
.hero p {
    color: #526071;
    line-height: 1.8;
    font-size: 15px;
}
.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-top: 20px;
}
.stat-card {
    background: linear-gradient(135deg, #f4fbff, #f6fff8);
    border: 1px solid #dbe8f5;
    border-radius: 18px;
    padding: 18px;
}
.stat-value {
    font-size: 28px;
    font-weight: bold;
    color: #0f6cbd;
}
.stat-label {
    margin-top: 6px;
    font-size: 13px;
    color: #667085;
}
.toolbar {
    background: rgba(255,255,255,0.96);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 12px 30px rgba(31,45,61,0.08);
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
}
.search {
    flex: 1;
    min-width: 240px;
    border: 2px solid #dbe8f5;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
}
.search:focus {
    border-color: #0f6cbd;
}
.tab-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
.tab-btn {
    border: none;
    border-radius: 999px;
    background: #eaf3ff;
    color: #0f6cbd;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}
.tab-btn.active {
    background: #0f6cbd;
    color: #fff;
}
.section {
    background: rgba(255,255,255,0.96);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 12px 30px rgba(31,45,61,0.08);
}
.section-head {
    margin-bottom: 18px;
}
.section-head h2 {
    font-size: 28px;
    color: #1f2d3d;
}
.section-head p {
    color: #667085;
    font-size: 14px;
    margin-top: 8px;
    line-height: 1.7;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 16px;
}
.ipa-card {
    border: 1px solid #dde7f4;
    border-radius: 20px;
    padding: 18px;
    background: linear-gradient(180deg, #ffffff, #f9fbff);
}
.ipa-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 12px;
}
.ipa-symbol {
    font-size: 34px;
    font-weight: bold;
    color: #0f6cbd;
    line-height: 1;
}
.ipa-cn {
    margin-top: 8px;
    color: #526071;
    font-size: 14px;
    line-height: 1.6;
}
.ipa-note {
    margin-top: 6px;
    color: #98a2b3;
    font-size: 12px;
}
.ipa-mnemonic {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #fff7e8;
    border: 1px solid #ffe1a8;
    color: #8a5a00;
    font-size: 13px;
    line-height: 1.6;
}
.ipa-mnemonic strong {
    color: #b46900;
}
.btn {
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    padding: 8px 12px;
}
.btn-sound {
    background: #27ae60;
    color: #fff;
}
.btn-light {
    background: #eef5ff;
    color: #0f6cbd;
}
.example-title {
    font-size: 13px;
    color: #667085;
    margin-bottom: 10px;
}
.example-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.example-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 999px;
    background: #f3f9ff;
    border: 1px solid #d8e9ff;
    font-size: 13px;
}
.example-word {
    font-weight: bold;
    color: #1f2d3d;
}
.example-ipa {
    color: #667085;
}
.empty {
    padding: 50px 20px;
    text-align: center;
    color: #98a2b3;
    font-size: 16px;
}
@media (max-width: 768px) {
    .page { padding: 14px; }
    .hero h1 { font-size: 28px; }
    .section-head h2 { font-size: 24px; }
    .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="page">
    <div class="hero">
        <h1>英语 48 个国际音标（英式 RP）</h1>
        <p>
            当前页面按你提供的英式 RP 教学口径整理为 48 个音标：20 个元音、28 个辅音与常见组合音。
            元音发音时气流基本不受阻碍，辅音发音时气流会受到阻碍；浊辅音发音时声带会振动。
            音标按钮播放本地音频，示例词用于帮助理解口型和常见拼读场景。
            你可以按分类学习，也可以直接搜索音标或单词。
        </p>
        <div class="stats" id="stats"></div>
    </div>

    <div class="toolbar">
        <input id="searchInput" class="search" type="text" placeholder="搜索音标、口型提示、示例词，比如 /iː/、apple、双元音">
        <div class="tab-bar" id="tabBar"></div>
    </div>

    <div class="section">
        <div class="section-head">
            <h2 id="sectionTitle">国际音标总览</h2>
            <p id="sectionDesc"></p>
        </div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" style="display:none">没有匹配到结果，换个音标或单词试试。</div>
    </div>
</div>

const IPA_MNEMONICS = {

    '/ɑː/':'张大嘴，长“啊”',
    '/ɔː/':'嘴唇收圆前突，长“奥”',

let activeTab = 'all';
let keyword = '';
let voicesCache = [];
const FEMALE_VOICE_PRIORITY = [
    'Samantha', 'Karen', 'Moira', 'Tessa', 'Allison', 'Ava', 'Serena', 'Susan', 'Victoria'
];
let currentIpaAudio = null;

function loadVoices() {
    voicesCache = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}

if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickPreferredEnglishVoice() {
    if (!voicesCache.length) return null;
    for (const name of FEMALE_VOICE_PRIORITY) {
        const exact = voicesCache.find(v => v.name === name && /^en/i.test(v.lang));
        if (exact) return exact;
        const partial = voicesCache.find(v => v.name.includes(name) && /^en/i.test(v.lang));
        if (partial) return partial;
    }
    const englishFemaleByHint = voicesCache.find(v =>
        /^en/i.test(v.lang) && /(female|woman|samantha|karen|moira|tessa|ava|allison|serena|susan|victoria|flo)/i.test(v.name)
    );
    if (englishFemaleByHint) return englishFemaleByHint;
    const americanEnglish = voicesCache.find(v => v.lang === 'en-US');
    if (americanEnglish) return americanEnglish;
    return voicesCache.find(v => /^en/i.test(v.lang)) || null;
}

function speakText(text, rate = 0.8, pitch = 1.0) {
    if (!('speechSynthesis' in window)) {
        alert('当前浏览器不支持语音朗读，请换用较新的 Chrome / Edge / Safari。');
        return;
    }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = rate;
    utter.pitch = pitch;
    const voice = pickPreferredEnglishVoice();
    if (voice) utter.voice = voice;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
}

function speakWordSet(words, rate = 0.68, pitch = 1.0) {
    if (!words || !words.length) return;
    if (!('speechSynthesis' in window)) {
        alert('当前浏览器不支持语音朗读，请换用较新的 Chrome / Edge / Safari。');
        return;
    }
    window.speechSynthesis.cancel();
    const voice = pickPreferredEnglishVoice();
    const queue = [...words];
    const playNext = () => {
        const word = queue.shift();
        if (!word) return;
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = 'en-US';
        utter.rate = rate;
        utter.pitch = pitch;
        if (voice) utter.voice = voice;
        utter.onend = () => {
            if (queue.length) setTimeout(playNext, 140);
        };
        window.speechSynthesis.speak(utter);
    };
    playNext();
}

function playIpaAudio(symbol) {
    const src = IPA_AUDIO_FILES[symbol];
    if (!src) {
        alert(`还没有找到 ${symbol} 的音频文件。`);
        return;
    }
    try {
        if (currentIpaAudio) {
            currentIpaAudio.pause();
            currentIpaAudio.currentTime = 0;
        }
        currentIpaAudio = new Audio(src);
        currentIpaAudio.play().catch(() => {
            alert('音频播放失败，请确认浏览器允许本地文件播放音频。');
        });
    } catch (err) {
        alert('音频播放失败：' + err.message);
    }
}

function getAllItems() {
    return ['vowels', 'diphthongs', 'consonants'].flatMap(group =>
        IPA_DATA[group].items.map(item => ({ ...item, group }))
    );
}

function getFilteredItems() {
    let items = activeTab === 'all' ? getAllItems() : IPA_DATA[activeTab].items.map(item => ({ ...item, group: activeTab }));
    if (!keyword) return items;
    const kw = keyword.toLowerCase().trim();
    return items.filter(item => {
        const exampleText = item.examples.map(x => x.join(' ')).join(' ');
        const mnemonic = IPA_MNEMONICS[item.symbol] || '';
        return `${item.symbol} ${item.cn} ${item.cue} ${mnemonic} ${exampleText}`.toLowerCase().includes(kw);
    });
}

function renderStats() {
    const items = getAllItems();
    const exampleCount = items.reduce((sum, item) => sum + item.examples.length, 0);
    const stats = [
        { value: '48', label: '国际音标总数' },
        { value: '12', label: '单元音' },
        { value: '8', label: '双元音' },
        { value: '28', label: '辅音与组合' },
        { value: String(exampleCount), label: '示例词数量' }
    ];
    document.getElementById('stats').innerHTML = stats.map(s => `
        <div class="stat-card">
            <div class="stat-value">${s.value}</div>
            <div class="stat-label">${s.label}</div>
        </div>
    `).join('');
}

function renderTabs() {
    document.getElementById('tabBar').innerHTML = TAB_META.map(tab => `
        <button class="tab-btn ${tab.key === activeTab ? 'active' : ''}" type="button" onclick="switchTab('${tab.key}')">${tab.title}</button>
    `).join('');
}

function renderHeader() {
    const titleEl = document.getElementById('sectionTitle');
    const descEl = document.getElementById('sectionDesc');
    if (activeTab === 'all') {
        titleEl.textContent = '国际音标总览';
        descEl.textContent = '当前展示英语 48 个国际音标（英式 RP）。左侧“音标发音”按钮播放本地音频，右侧仍可听示例词。';
        return;
    }
    titleEl.textContent = IPA_DATA[activeTab].title;
    descEl.textContent = IPA_DATA[activeTab].desc;
}

function renderGrid() {
    renderTabs();
    renderHeader();
    const items = getFilteredItems();
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    if (!items.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';
    grid.innerHTML = items.map(item => `
        <div class="ipa-card">
            <div class="ipa-top">
                <div>
                    <div class="ipa-symbol">${item.symbol}</div>
                    <div class="ipa-cn">${item.cn}</div>
                    <div class="ipa-note">口型提示：${item.cue}</div>
                    ${IPA_MNEMONICS[item.symbol] ? `<div class="ipa-mnemonic"><strong>速记口诀：</strong>${IPA_MNEMONICS[item.symbol]}</div>` : ''}
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
                    <button class="btn btn-sound" type="button" onclick="playIpaAudio('${escapeJs(item.symbol)}')">音标发音</button>
                    <button class="btn btn-light" type="button" onclick="speakText('${escapeJs(item.examples[0][0])}', 0.68, 1.0)">标准例词</button>
                </div>
            </div>
            <div class="example-title">
                左侧按钮是音标本身的独立音频；下面这些是例词发音。建议先听音标，再听例词做对应。
                <button class="btn btn-light" type="button" style="margin-left:8px" onclick="speakWordSet(['${escapeJs(item.examples[0][0])}','${escapeJs(item.examples[1][0])}','${escapeJs(item.examples[2][0])}'], 0.66, 1.0)">连读3词</button>
            </div>
            <div class="example-list">
                ${item.examples.map(ex => `
                    <span class="example-chip">
                        <span class="example-word">${ex[0]}</span>
                        <span class="example-ipa">${ex[1]}</span>
                        <button class="btn btn-light" type="button" onclick="speakText('${escapeJs(ex[0])}', 0.72, 1.0)">发音</button>
                    </span>
                `).join('')}
            </div>
        </div>
    `).join('');
}

function switchTab(tab) {
    activeTab = tab;
    renderGrid();
}

function escapeJs(text) {
    return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

document.getElementById('searchInput').addEventListener('input', (e) => {
    keyword = e.target.value;
    renderGrid();
});

renderStats();
renderGrid();
</script>
